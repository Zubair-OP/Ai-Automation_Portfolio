<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#070808"/>
  <!-- Lime radial glow (matches navbar circle gradient) -->
  <radialGradient id="g" cx="35%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.15"/>
  </radialGradient>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Subtle border -->
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" fill="none" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Z letter -->
  <text
    x="16" y="22"
    text-anchor="middle"
    font-family="'Inter', 'ui-sans-serif', system-ui, sans-serif"
    font-size="17"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#070808"
  >Z</text>
</svg>
